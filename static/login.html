<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14161a"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><title>C5 Print Hub</title>
<style>body{margin:0;background:#14161a;color:#eef0f3;font:18px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
form{width:100%;max-width:340px}input,button{width:100%;font:inherit;padding:16px;border-radius:12px;border:1px solid #2e323a;margin-top:10px;box-sizing:border-box}
input{background:#1f2228;color:#eef0f3;font-size:28px;letter-spacing:.3em;text-align:center}button{background:#3d8bfd;color:#fff;border:0;font-weight:700}#e{color:#ff9b9e;min-height:1.4em;margin-top:10px}</style></head>
<body><form onsubmit="go(event)"><h2 style="margin:0">C5 Print Hub</h2><input id="p" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" autofocus>
<button>Open</button><div id="e"></div></form>
<script>async function go(ev){ev.preventDefault();const r=await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("p").value})});
if(r.ok)location.reload();else document.getElementById("e").textContent="Wrong PIN";}</script></body></html>
